<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>House of David</title>
  <link rel="shortcut icon" href="cdn/files/uploads/10469550/FavIcon.png" type="image/jpeg">
  <link rel="icon" href="cdn/files/uploads/10469550/FavIcon.png" type="image/jpeg">
  <link rel="apple-touch-icon" sizes="152x152" href="cdn/files/uploads/10469550/FavIcon.png">
  <link rel="apple-touch-icon" sizes="167x167" href="cdn/files/uploads/10469550/FavIcon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="cdn/files/uploads/10469550/FavIcon.png">
  <style>
    :root {
      --bg: #08090d;
      --panel: #11141c;
      --panel-raised: #171b25;
      --line: rgba(255, 255, 255, 0.09);
      --line-strong: rgba(255, 255, 255, 0.16);
      --text: #f6f7fb;
      --muted: #9ba4b5;
      --accent: #ff5964;
      --accent-warm: #ff7a4d;
      --success: #62d8a1;
      --radius-lg: 22px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 8% -5%, rgba(255, 89, 100, 0.13), transparent 30rem),
        radial-gradient(circle at 95% 15%, rgba(255, 122, 77, 0.08), transparent 28rem),
        var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
    }

    [hidden] {
      display: none !important;
    }

    .app {
      width: min(1320px, 100%);
      margin: 0 auto;
      padding: 28px clamp(16px, 3vw, 36px) 40px;
    }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-icon {
      display: grid;
      flex: 0 0 auto;
      width: 52px;
      height: 52px;
      place-items: center;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent-warm));
      box-shadow: 0 12px 30px rgba(255, 89, 100, 0.25);
    }

    .brand-icon svg {
      width: 22px;
      height: 22px;
      margin-left: 2px;
      fill: white;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--accent);
      font-size: 0.7rem;
      font-weight: 750;
      letter-spacing: 0.16em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .site-header h1 {
      margin: 0;
      font-size: clamp(1.55rem, 2.6vw, 2.15rem);
      letter-spacing: -0.035em;
      line-height: 1.05;
    }

    .episode-count {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 9px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(17, 20, 28, 0.7);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 650;
      white-space: nowrap;
      backdrop-filter: blur(12px);
    }

    .episode-count .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 4px rgba(98, 216, 161, 0.12);
    }

    .layout {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      gap: 22px;
      align-items: start;
    }

    .playlist-card,
    .player-card {
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: rgba(17, 20, 28, 0.86);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(16px);
    }

    .playlist-card {
      position: sticky;
      top: 24px;
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 48px);
      padding: 18px;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 2px 2px 0;
    }

    .card-head h2 {
      margin: 0;
      font-size: 1.05rem;
      letter-spacing: -0.015em;
    }

    .count-badge {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.035);
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 700;
    }

    .episode-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
      margin: 16px 0 0;
      padding: 0 4px 0 0;
      overflow-y: auto;
      list-style: none;
      scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
      scrollbar-width: thin;
    }

    .episode-list::-webkit-scrollbar {
      width: 6px;
    }

    .episode-list::-webkit-scrollbar-thumb {
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.16);
    }

    .episode-btn {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr) 24px;
      gap: 12px;
      align-items: center;
      width: 100%;
      padding: 10px;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.032);
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition:
        background 160ms ease,
        border-color 160ms ease,
        transform 160ms ease;
    }

    .episode-btn:hover {
      border-color: var(--line);
      background: rgba(255, 255, 255, 0.06);
      transform: translateX(2px);
    }

    .episode-btn[aria-current="true"] {
      border-color: rgba(255, 89, 100, 0.42);
      background: linear-gradient(90deg, rgba(255, 89, 100, 0.16), rgba(255, 89, 100, 0.035));
      box-shadow: inset 0 0 0 1px rgba(255, 89, 100, 0.08);
    }

    .episode-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .ep-number {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.035);
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      transition:
        background 160ms ease,
        border-color 160ms ease,
        color 160ms ease;
    }

    .episode-btn[aria-current="true"] .ep-number {
      border-color: transparent;
      background: linear-gradient(135deg, var(--accent), var(--accent-warm));
      color: white;
    }

    .ep-copy {
      display: block;
      min-width: 0;
    }

    .ep-title,
    .ep-sub {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ep-title {
      font-size: 0.86rem;
      font-weight: 700;
      letter-spacing: -0.005em;
    }

    .ep-sub {
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.72rem;
    }

    .ep-action {
      display: grid;
      width: 24px;
      height: 24px;
      place-items: center;
      border-radius: 50%;
      color: var(--muted);
      font-size: 0.58rem;
      opacity: 0.35;
      transition:
        background 160ms ease,
        color 160ms ease,
        opacity 160ms ease;
    }

    .episode-btn:hover .ep-action,
    .episode-btn[aria-current="true"] .ep-action {
      background: rgba(255, 89, 100, 0.14);
      color: var(--accent);
      opacity: 1;
    }

    .playlist-tip {
      margin: 14px 2px 0;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.7rem;
      line-height: 1.5;
    }

    .player-card {
      min-width: 0;
      overflow: hidden;
    }

    .player-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 20px 16px;
    }

    .now-label {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 0 0 5px;
      color: var(--muted);
      font-size: 0.67rem;
      font-weight: 750;
      letter-spacing: 0.12em;
      line-height: 1;
      text-transform: uppercase;
    }

    .now-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 3px rgba(98, 216, 161, 0.11);
    }

    .player-head h2 {
      margin: 0;
      font-size: clamp(1.35rem, 2.2vw, 1.7rem);
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .player-head .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.76rem;
    }

    .video-shell {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #000;
    }

    .video-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #000;
    }

    .video-frame iframe {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    .stage-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 24px;
      background:
        radial-gradient(circle at center, rgba(255, 89, 100, 0.06), transparent 45%),
        #050608;
      text-align: center;
    }

    .loading-overlay {
      z-index: 3;
      pointer-events: none;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(255, 255, 255, 0.14);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 800ms linear infinite;
    }

    .stage-overlay p {
      margin: 0;
    }

    .loading-overlay p {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      padding: 16px 18px 12px;
    }

    .control-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 0;
      padding: 12px 10px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--panel-raised);
      color: #e9edf4;
      font-size: 0.78rem;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      cursor: pointer;
      transition:
        background 160ms ease,
        border-color 160ms ease,
        transform 160ms ease,
        opacity 160ms ease;
    }

    .control-btn svg {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .control-btn:hover:not(:disabled) {
      border-color: var(--line-strong);
      background: #202635;
      transform: translateY(-1px);
    }

    .control-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .control-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .control-btn:disabled {
      cursor: not-allowed;
      opacity: 0.32;
    }

    .player-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 20px 16px;
      color: var(--muted);
      font-size: 0.69rem;
    }

    .player-meta p {
      margin: 0;
    }

    .player-meta kbd {
      display: inline-block;
      min-width: 19px;
      padding: 2px 5px;
      border: 1px solid var(--line);
      border-bottom-color: var(--line-strong);
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.04);
      color: #c5ccd8;
      font-family: inherit;
      font-size: 0.65rem;
      line-height: 1.2;
      text-align: center;
    }

    .position-label {
      flex: 0 0 auto;
      color: #c9d0db;
      font-variant-numeric: tabular-nums;
      font-weight: 650;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: minmax(0, 1fr);
      }

      .player-card {
        order: 1;
      }

      .playlist-card {
        position: static;
        order: 2;
        max-height: none;
      }

      .episode-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        overflow: visible;
      }
    }

    @media (max-width: 620px) {
      .app {
        padding-top: 20px;
      }

      .site-header {
        align-items: flex-start;
        margin-bottom: 18px;
      }

      .brand-icon {
        width: 46px;
        height: 46px;
        border-radius: 14px;
      }

      .episode-count {
        padding: 9px 11px;
        font-size: 0.7rem;
      }

      .player-head {
        align-items: flex-start;
        padding: 16px 16px 14px;
      }

      .controls {
        gap: 8px;
        padding: 14px 12px 10px;
      }

      .control-btn {
        flex-direction: column;
        gap: 6px;
        padding: 11px 6px;
        font-size: 0.7rem;
      }

      .player-meta {
        padding: 0 16px 14px;
      }

      .player-meta .shortcuts {
        display: none;
      }

      .player-meta {
        justify-content: flex-end;
      }

      .episode-list {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    @media (max-width: 420px) {
      .episode-count {
        display: none;
      }

      .player-head {
        flex-direction: column;
        gap: 12px;
      }

      .controls {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .control-btn {
        flex-direction: row;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="site-header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M8 5.14v13.72a1 1 0 0 0 1.54.84l10.1-6.86a1 1 0 0 0 0-1.68L9.54 4.3A1 1 0 0 0 8 5.14Z"/>
          </svg>
        </div>
        <div>
          <h1>House of David</h1>
        </div>
      </div>
      <div class="episode-count" aria-label="16 episodes available">
        <span class="dot" aria-hidden="true"></span>
        16 episodes
      </div>
    </header>

    <main class="layout">
      <aside class="playlist-card" aria-labelledby="playlistTitle">
        <div class="card-head">
          <div>
            <p class="eyebrow">Playlist</p>
            <h2 id="playlistTitle">Choose an episode</h2>
          </div>
          <span class="count-badge" aria-hidden="true">16</span>
        </div>

        <ul class="episode-list" id="episodeList"></ul>

        <p class="playlist-tip">Select an episode to load it in the player. Previous and Next move through the episodes.</p>
      </aside>

      <section class="player-card" aria-labelledby="currentTitle">
        <div class="player-head">
          <div>
            <p class="now-label">
              <span class="now-dot" aria-hidden="true"></span>
              <span id="nowStatus">Now selected</span>
            </p>
            <h2 id="currentTitle" aria-live="polite">Season 1</h2>
            <p class="subtitle" id="currentSubtitle">Episode 1</p>
          </div>
        </div>

        <div class="video-shell">
          <div class="video-frame">
            <iframe
              id="playerFrame"
              title="Episode video player"
              allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
              allowfullscreen
              loading="eager"
            ></iframe>

            <div class="stage-overlay loading-overlay" id="loadingOverlay" role="status" aria-live="polite">
              <span class="spinner" aria-hidden="true"></span>
              <p>Loading episode…</p>
            </div>
          </div>
        </div>

        <div class="controls" role="group" aria-label="Episode navigation">
          <button class="control-btn" id="prevBtn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M6 5h2v14H6zM19 5v14l-9-7 9-7z"/>
            </svg>
            <span>Previous</span>
          </button>

          <button class="control-btn" id="nextBtn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M16 5h2v14h-2zM5 5v14l9-7-9-7z"/>
            </svg>
            <span>Next</span>
          </button>

          <a class="control-btn" id="downloadLink" href="#" target="_blank" rel="noopener">
            <span>Download</span>
          </a>
        </div>

        <div class="player-meta">
          <p class="shortcuts">Use <kbd>←</kbd> <kbd>→</kbd> to move between episodes.</p>
          <p class="position-label" id="positionLabel">1 / 16</p>
        </div>
      </section>
    </main>
  </div>

  <script>
    (function () {
      "use strict";

      var episodes = [
        { title: "Episode 1", subtitle: "Season 1", id: "1mzYBBWWB5kjLCBDHaMsTFN7EoXE60Y4y" },
        { title: "Episode 2", subtitle: "Season 1", id: "1m8s-rHq86Tjmpx1v4GXcp3XH31-Wge8I" },
        { title: "Episode 3", subtitle: "Season 1", id: "1iIkrPMZyRjcbe_4UFFBxYZvmTn0STkoU" },
        { title: "Episode 4", subtitle: "Season 1", id: "1aqH5oQBZWVz10gd5WxIh473xhut9ZQgc" },
        { title: "Episode 5", subtitle: "Season 1", id: "1yiaTw4w2schm9HozzSGkj9CFSvBulb2o" },
        { title: "Episode 6", subtitle: "Season 1", id: "1L8XDNgmLx2nPCnNdIU4uF4HHnoP25tZ8" },
        { title: "Episode 7", subtitle: "Season 1", id: "1zgPpyVohUnVc9pjiMaJtc1ec0GSHTal7" },
        { title: "Episode 8", subtitle: "Season 1", id: "1eup9mAIrP94kKN5JPC7jc3WBpHlcq_aD" },
        { title: "Episode 1", subtitle: "Season 2", id: "1BS2935oamtAkDcuSJts8foBSFC9X929t" },
        { title: "Episode 2", subtitle: "Season 2", id: "1Mh0CPS2hGyp0PSUBN0vRw9gW3v2vZuFq" },
        { title: "Episode 3", subtitle: "Season 2", id: "1p_hc9MmtThF-9Fz0jPfvdikWfuvMoDcs" },
        { title: "Episode 4", subtitle: "Season 2", id: "1rlIE0Ct-ZyQmFBQKoGdChbeE3-8msF-U" },
        { title: "Episode 5", subtitle: "Season 2", id: "14QY-SyUFAku1kM3f2JNo_miwK_JEKqMA" },
        { title: "Episode 6", subtitle: "Season 2", id: "1FURpHCukJO8seDMYWRgJm8yGo-nF7ydj" },
        { title: "Episode 7", subtitle: "Season 2", id: "1FMudTON5GF8LS-agiSw65pRw4EFDEO5U" },
        { title: "Episode 8", subtitle: "Season 2", id: "1RZeHvyALHkns9WEPH9GxHOvfZyNyihNR" }
      ];

      var episodeList = document.getElementById("episodeList");
      var playerFrame = document.getElementById("playerFrame");
      var loadingOverlay = document.getElementById("loadingOverlay");
      var currentTitle = document.getElementById("currentTitle");
      var currentSubtitle = document.getElementById("currentSubtitle");
      var nowStatus = document.getElementById("nowStatus");
      var downloadLink = document.getElementById("downloadLink");
      var positionLabel = document.getElementById("positionLabel");
      var prevBtn = document.getElementById("prevBtn");
      var nextBtn = document.getElementById("nextBtn");

      var state = {
        current: 0
      };

      var loadTimer = null;

      function previewUrl(episode) {
        return "https://drive.google.com/file/d/" + episode.id + "/preview";
      }

      function downloadUrl(episode) {
        return "https://drive.google.com/uc?export=download&id=" + encodeURIComponent(episode.id);
      }

      function renderPlaylist() {
        var fragment = document.createDocumentFragment();

        episodes.forEach(function (episode, index) {
          var item = document.createElement("li");
          var button = document.createElement("button");
          var number = document.createElement("span");
          var copy = document.createElement("span");
          var title = document.createElement("span");
          var subtitle = document.createElement("span");
          var action = document.createElement("span");

          button.type = "button";
          button.className = "episode-btn";
          button.dataset.index = String(index);
          button.setAttribute("aria-label", "Play " + episode.title + ", " + episode.subtitle);

          number.className = "ep-number";
          number.textContent = String(index + 1).padStart(2, "0");

          copy.className = "ep-copy";
          title.className = "ep-title";
          title.textContent = episode.title;
          subtitle.className = "ep-sub";
          subtitle.textContent = episode.subtitle;
          copy.appendChild(title);
          copy.appendChild(subtitle);

          action.className = "ep-action";
          action.setAttribute("aria-hidden", "true");
          action.textContent = "▶";

          button.appendChild(number);
          button.appendChild(copy);
          button.appendChild(action);
          button.addEventListener("click", function () {
            selectEpisode(index);
          });

          item.appendChild(button);
          fragment.appendChild(item);
        });

        episodeList.appendChild(fragment);
      }

      function updateSelection() {
        var buttons = episodeList.querySelectorAll(".episode-btn");
        var episode = episodes[state.current];

        buttons.forEach(function (button, index) {
          if (index === state.current) {
            button.setAttribute("aria-current", "true");
          } else {
            button.removeAttribute("aria-current");
          }
        });

        currentTitle.textContent = episode.title;
        currentSubtitle.textContent = episode.subtitle;
        positionLabel.textContent = (state.current + 1) + " / " + episodes.length;
        downloadLink.href = downloadUrl(episode);
        downloadLink.setAttribute("aria-label", "Download " + episode.title + ", " + episode.subtitle);

        prevBtn.disabled = state.current === 0;
        nextBtn.disabled = state.current === episodes.length - 1;
      }

      function beginLoading() {
        var episode = episodes[state.current];

        window.clearTimeout(loadTimer);
        loadingOverlay.hidden = false;
        nowStatus.textContent = "Loading…";

        playerFrame.title = episode.title + " — " + episode.subtitle;
        playerFrame.src = previewUrl(episode);

        loadTimer = window.setTimeout(function () {
          loadingOverlay.hidden = true;
          nowStatus.textContent = "Now loaded";
        }, 12000);
      }

      function selectEpisode(index) {
        if (index < 0 || index >= episodes.length) {
          return;
        }

        state.current = index;
        updateSelection();
        beginLoading();

        var selectedButton = episodeList.querySelector('.episode-btn[data-index="' + index + '"]');
        if (selectedButton) {
          selectedButton.scrollIntoView({ block: "nearest", behavior: "smooth" });
        }
      }

      function goPrevious() {
        if (state.current > 0) {
          selectEpisode(state.current - 1);
        }
      }

      function goNext() {
        if (state.current < episodes.length - 1) {
          selectEpisode(state.current + 1);
        }
      }

      playerFrame.addEventListener("load", function () {
        window.clearTimeout(loadTimer);
        loadingOverlay.hidden = true;
        nowStatus.textContent = "Now loaded";
      });

      prevBtn.addEventListener("click", goPrevious);
      nextBtn.addEventListener("click", goNext);

      document.addEventListener("keydown", function (event) {
        var target = event.target;
        var tagName = target && target.tagName ? target.tagName : "";
        var isFormField = /^(INPUT|TEXTAREA|SELECT)$/.test(tagName);

        if (isFormField || event.altKey || event.ctrlKey || event.metaKey) {
          return;
        }

        if (event.key === "ArrowLeft") {
          if (!prevBtn.disabled) {
            event.preventDefault();
            goPrevious();
          }
        } else if (event.key === "ArrowRight") {
          if (!nextBtn.disabled) {
            event.preventDefault();
            goNext();
          }
        }
      });

      renderPlaylist();
      updateSelection();
      beginLoading();
    })();
  </script>
</body>
</html>
